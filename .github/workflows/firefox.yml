name: Firefox release integrity
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa415ba3cb73621ed34d # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python tools/check_firefox.py
      - name: Check the published signed artifact
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: python tools/check_firefox.py --download
