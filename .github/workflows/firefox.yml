name: Firefox release integrity
on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python tools/check_firefox.py
      - name: Check the published signed artifact
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: python tools/check_firefox.py --download
